<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Game</title>
    <link rel="icon" href="assets/img/Logo.png" type="image/icon type">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <h1>Press the Correct Arrow Key!</h1>
    <div class="game-box" id="arrow-box">⬆</div>
    <div class="score">Score: <span id="score">0</span></div>
    <div class="score">High Score: <span id="high-score">0</span></div>
    
    <div class="controls">
        <button class="button" onclick="handleInput('ArrowUp')">⬆</button>
    </div>
    <div class="controls">
        <button class="button" onclick="handleInput('ArrowLeft')">⬅</button>
        <button class="button" onclick="handleInput('ArrowDown')">⬇</button>
        <button class="button" onclick="handleInput('ArrowRight')">➡</button>
    </div>
    
    <script>
        const arrows = ['⬆', '⬇', '⬅', '➡'];
        const keyMap = { 'ArrowUp': '⬆', 'ArrowDown': '⬇', 'ArrowLeft': '⬅', 'ArrowRight': '➡' };
        let score = 0;
        let highScore = localStorage.getItem('highScore') ? parseInt(localStorage.getItem('highScore')) : 0;
        document.getElementById('high-score').textContent = highScore;
        let currentArrow = '';
        let switchTimer;
        let pressTimer;

        function generateArrow() {
            clearTimeout(switchTimer);
            clearTimeout(pressTimer);
            currentArrow = arrows[Math.floor(Math.random() * arrows.length)];
            document.getElementById('arrow-box').textContent = currentArrow;
            
            pressTimer = setTimeout(() => {
                score = Math.max(0, score - 1);
                document.getElementById('score').textContent = score;
                document.getElementById('arrow-box').classList.add('error');
                setTimeout(() => {
                    document.getElementById('arrow-box').classList.remove('error');
                }, 300);
            }, 500);

            switchTimer = setTimeout(() => {
                generateArrow();
            }, 1500);
        }

        function handleInput(key) {
            if (keyMap[key] === currentArrow) {
                clearTimeout(pressTimer);
                score++;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('highScore', highScore);
                    document.getElementById('high-score').textContent = highScore;
                }
            } else {
                score = 0;
                document.getElementById('arrow-box').classList.add('error');
                setTimeout(() => {
                    document.getElementById('arrow-box').classList.remove('error');
                }, 300);
            }
            document.getElementById('score').textContent = score;
            generateArrow();
        }

        document.addEventListener('keydown', (event) => {
            handleInput(event.key);
        });

        generateArrow();
    </script>
</body>
</html>
